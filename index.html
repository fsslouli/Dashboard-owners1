         هذي السياسة ترسل «اسم الموقع» فقط بدون مسار الصفحة — وهي اللي يوصي بها يوتيوب. -->

    <!-- ══════════════════════════════════════════════════════════════
         شاشة الإقلاع — تمنع «وميض التصميم القديم».

         المشكلة: الطقم والتصميم المعتمدان يُقرآن من قاعدة البيانات، فالموقع
         كان يرسم التصميم الافتراضي (الكلاسيكي) أولًا ثم يقلب للمعتمد لما يوصل
         الرد — لفة مزعجة يشوفها الزائر كل مرة.

         الحل هنا: طبقة تُرسم قبل تحميل حزمة الجافاسكربت أصلًا، بلون خلفية
         الطقم المحفوظ من آخر زيارة، وتغطي الصفحة لين يجهز التصميم الصحيح.
         الزائر ما يشوف إلا تصميمًا واحدًا: الصحيح.
         ══════════════════════════════════════════════════════════════ -->
    <style>
      html, body { margin: 0; height: 100%; background: var(--boot-bg, #141C22); }
      #boot {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; align-items: center; justify-content: center;
        background: var(--boot-bg, #141C22);
        transition: opacity .16s ease-out;
      }
      #boot.boot-gone { opacity: 0; pointer-events: none; }
      /* مؤشر الإقلاع يمشي مع التصميم المعتمد: فجر = نوافذ تضيء عشوائياً على خط الأفق، بنّاء = لبنات تتراص، نوفا = حلقة هادئة */
      #boot .bt { position: relative; display: flex; align-items: flex-end; gap: 7px; height: 30px; padding-bottom: 6px; }
      #boot .bt::after { content: ""; position: absolute; inset-inline: -10px; bottom: 0; height: 1px; background: var(--boot-fg, #8FA0AB); opacity: .32; }
      #boot i { display: block; width: 8px; height: 12px; border-radius: 2px 2px 1px 1px; background: var(--boot-fg, #8FA0AB); opacity: .2; animation: boot-win 2.1s ease-in-out infinite; }
      #boot i:nth-child(1) { height: 14px; animation-delay: .15s; }
      #boot i:nth-child(2) { height: 20px; animation-delay: 1.05s; }
      #boot i:nth-child(3) { height: 11px; animation-delay: .55s; }
      #boot i:nth-child(4) { height: 18px; animation-delay: 1.5s; }
      #boot i:nth-child(5) { height: 13px; animation-delay: .8s; }
      @keyframes boot-win { 0%,100% { opacity: .18; background: var(--boot-fg, #8FA0AB); } 40%,60% { opacity: 1; background: var(--boot-ac, #D9A441); } }
      html[data-boot-design="bannaa"] #boot .bt::after { display: none; }
      html[data-boot-design="bannaa"] #boot i { height: 8px; width: 16px; border-radius: 1px; animation-name: boot-brick; }
      html[data-boot-design="bannaa"] #boot .bt { align-items: center; gap: 4px; flex-direction: column-reverse; height: auto; padding: 0; }
      @keyframes boot-brick { 0%,100% { opacity: .15; } 50% { opacity: .9; background: var(--boot-ac, #D9A441); } }
      html[data-boot-design="nova"] #boot .bt { width: 30px; height: 30px; padding: 0; justify-content: center; align-items: center; }
      html[data-boot-design="nova"] #boot .bt::after { inset: 0; height: auto; border-radius: 50%; background: none; opacity: 1; border: 2px solid var(--boot-fg, #8FA0AB); border-top-color: var(--boot-ac, #D9A441); animation: boot-spin 1.1s linear infinite; }
      html[data-boot-design="nova"] #boot i { display: none; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot i { animation: none; opacity: .55; } html[data-boot-design="nova"] #boot .bt::after { animation: none; } }
      /* بيت ينبني: أرضية ← أساس ← جدران ← سقف ← باب ← نوافذ تضيء ← عمود إنارة، على ورقة مشبّكة بألوان الطقم */
      #boot .sc { position: relative; width: min(300px, 80vw); height: 230px; overflow: hidden; border-radius: 18px; background: color-mix(in srgb, var(--boot-ac, #D9A441) 7%, var(--boot-bg, #141C22)); border: 1px solid color-mix(in srgb, var(--boot-fg, #8FA0AB) 22%, transparent); }
      #boot .sc .gr { position: absolute; inset: 0; background-image: linear-gradient(color-mix(in srgb, var(--boot-fg, #8FA0AB) 15%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--boot-fg, #8FA0AB) 15%, transparent) 1px, transparent 1px); background-size: 20px 20px; }
      #boot .sc svg { position: absolute; left: 50%; top: 50%; width: 240px; height: 190px; margin: -95px 0 0 -120px; overflow: visible; }
      #boot .sc .ln { fill: none; stroke: var(--boot-ac, #D9A441); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 400; stroke-dashoffset: 400; animation: boot-build 4.2s ease-in-out infinite; }
      #boot .sc .fi { fill: var(--boot-ac, #D9A441); opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; animation: boot-pop 4.2s ease-out infinite; }
      #boot .sc .fl { fill: color-mix(in srgb, var(--boot-ac, #D9A441) 18%, transparent); opacity: 0; animation: boot-pop 4.2s ease-out infinite; }
      @keyframes boot-build { 0% { stroke-dashoffset: 400; } 40%, 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
      @keyframes boot-pop { 0%, 46% { opacity: 0; transform: scale(.4); } 60%, 90% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
      html[data-boot-design="bannaa"] #boot .sc, html[data-boot-design="nova"] #boot .sc { display: none; }
      #boot .bt { display: none; }
      html[data-boot-design="bannaa"] #boot .bt, html[data-boot-design="nova"] #boot .bt { display: flex; }
      @media (prefers-reduced-motion: reduce) { #boot .sc .ln { animation: none; stroke-dashoffset: 0; } #boot .sc .fi, #boot .sc .fl { animation: none; opacity: 1; } }
    </style>
    <script>
      (function () {
        try {
          var d = document.documentElement;
          /* نفس مفتاح تفضيل الوضع المستخدم داخل التطبيق */
          var mode = localStorage.getItem("owners-inquiries-theme") || "auto";
          var dark = mode === "dark" || (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var cfg = null;
          try { cfg = JSON.parse(localStorage.getItem("owners-site-config") || "null"); } catch (e2) { cfg = null; }
          var pick = function (o, fb) { return (o && (dark ? (o.dark || o.light) : (o.light || o.dark))) || fb; };
          d.style.setProperty("--boot-bg", pick(cfg && cfg.bg, dark ? "#141C22" : "#F7F9FB"));
          d.style.setProperty("--boot-fg", pick(cfg && cfg.fg, dark ? "#8FA0AB" : "#5F7280"));
          d.style.setProperty("--boot-ac", pick(cfg && cfg.ac, "#D9A441"));
          d.style.colorScheme = dark ? "dark" : "light";
          if (cfg && cfg.design) d.setAttribute("data-boot-design", cfg.design);
          /* خط الطقم المعتمد يُحمَّل من الآن — عشان ما يتبدّل الخط تحت عين الزائر */
          if (cfg && cfg.font) {
            var l = document.createElement("link");
            l.rel = "stylesheet"; l.href = cfg.font; l.dataset.skinFont = cfg.theme;
            document.head.appendChild(l);
          }
          /* خط التصميم المعتمد («بنّاء» مثلًا) — نفس الفكرة */
          if (cfg && cfg.dfont) {
            var l2 = document.createElement("link");
            l2.rel = "stylesheet"; l2.href = cfg.dfont; l2.dataset.designFont = cfg.design;
            document.head.appendChild(l2);
          }
        } catch (e) { /* تصفح خاص أو تخزين ممنوع — نكمل باللون الافتراضي */ }
        /* شبكة أمان أخيرة: لو صار خطأ منع التطبيق من الإقلاع، ما نخلي الزائر أمام شاشة صامتة */
        setTimeout(function () {
          var b = document.getElementById("boot");
          if (b) b.parentNode && b.parentNode.removeChild(b);
        }, 8000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true"><div class="sc"><div class="gr"></div>
<svg viewBox="0 0 240 190"><path class="ln" style="animation-delay:0s" d="M6 168H234"/><path class="ln" style="animation-delay:0.25s" d="M34 168V92H206V168"/><path class="ln" style="animation-delay:0.6s" d="M22 98L120 30L218 98"/><path class="ln" style="animation-delay:0.95s" d="M120 30V14M92 168V124H148V168"/><path class="ln" style="animation-delay:1.1s" d="M34 92H206"/><path class="ln" style="animation-delay:1.3s" d="M214 168V120M214 120h-9"/><rect class="fl" x="92" y="124" width="56" height="44" style="animation-delay:.2s"/><rect class="fi" x="52" y="108" width="24" height="26" style="animation-delay:.1s"/><rect class="fi" x="164" y="108" width="24" height="26" style="animation-delay:.25s"/><rect class="fi" x="108" y="56" width="24" height="18" style="animation-delay:.4s"/><circle class="fi" cx="205" cy="118" r="5" style="animation-delay:.6s"/></svg></div>
    <div class="bt"><i></i><i></i><i></i><i></i><i></i></div></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
